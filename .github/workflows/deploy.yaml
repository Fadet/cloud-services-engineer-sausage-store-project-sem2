name: Sausage Store Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  NEXUS_HELM_REPO: ${{ secrets.NEXUS_HELM_REPO }}
  NEXUS_HELM_REPO_USER: ${{ secrets.NEXUS_HELM_REPO_USER }}
  NEXUS_HELM_REPO_PASSWORD: ${{ secrets.NEXUS_HELM_REPO_PASSWORD }}
  SAUSAGE_STORE_NAMESPACE: ${{ vars.SAUSAGE_STORE_NAMESPACE }} #r-devops-magistracy-project-2sem-933104646
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
  # Имя релиза и чарта; чарт берётся из Nexus, а не из локального каталога
  HELM_RELEASE: sausage-store
  HELM_CHART: sausage-store
  # Версия чарта уникальна для каждого прогона: в helm history видно, какой прогон задеплоен
  HELM_CHART_VERSION: 0.1.${{ github.run_number }}

jobs:
  # Сборка и пуш образов в докерхаб:
  build_and_push_to_docker_hub:
      name: Push Docker image to DockerHub
      runs-on: ubuntu-latest
      steps:
        - name: Check out the repo
          # Получение исходного кода из репозитория:
          uses: actions/checkout@v3
        - name: Set up Docker Buildx
          # Установка сборщика контейнеров Docker:
          uses: docker/setup-buildx-action@v2
        - name: Login to Docker
          # Авторизация на Docker Hub:
          uses: docker/login-action@v2
          # При помощи with передаём в action параметры username и password:
          with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASSWORD }}
            # Хорошо ли держать логин и пароль прямо в коде workflow?
            # Нет, это нехорошо. Хранить пароль надо в Secrets.
        - name: Push Backend to DockerHub
          # Одновременный билд и пуш образа в Docker Hub:
          uses: docker/build-push-action@v4
          with:
            # Параметр context: ./backend/ указывает, что нужный Dockerfile
            # находится в ./backend/
            context: ./backend/
            # Параметр push: true указывает, что образ нужно не только собрать,
            # но и отправить на Docker Hub:
            push: true
            # Каждый образ получает два тега: latest и sha коммита.
            # Тег с sha используется при деплое, чтобы Kubernetes
            # гарантированно перекатил поды на новую версию.
            tags: |
              ${{ secrets.DOCKER_USER }}/sausage-backend:latest
              ${{ secrets.DOCKER_USER }}/sausage-backend:${{ github.sha }}
            build-args: |
              VERSION=${{ github.sha }}
        - name: Push Frontend to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./frontend/
            push: true
            tags: |
              ${{ secrets.DOCKER_USER }}/sausage-frontend:latest
              ${{ secrets.DOCKER_USER }}/sausage-frontend:${{ github.sha }}
        - name: Push Backend-report to DockerHub
          uses: docker/build-push-action@v4
          with:
            context: ./backend-report/
            push: true
            tags: |
              ${{ secrets.DOCKER_USER }}/sausage-backend-report:latest
              ${{ secrets.DOCKER_USER }}/sausage-backend-report:${{ github.sha }}
  # Упаковываем helm-чарт и пушим его в Nexus
  add_helm_chart_to_nexus:
      name: Add Helm Chart To Nexus
      runs-on: ubuntu-latest
      needs: build_and_push_to_docker_hub

      steps:
        - name: Check out the repo
          uses: actions/checkout@v3
        - name: Set up Helm
          uses: azure/setup-helm@v3
          with:
            version: v3.14.0
        - name: Lint Helm chart
          run: helm lint ./sausage-store-chart
        - name: Package Helm chart
          # Версия чарта = 0.1.<run_number>, appVersion = sha коммита.
          # В Nexus включена политика "Allow redeploy" на случай повторного прогона.
          run: |
            helm package ./sausage-store-chart --destination ./packaged \
              --version "${HELM_CHART_VERSION}" --app-version "${{ github.sha }}"
            ls -l ./packaged
        - name: Upload Helm chart to Nexus
          # Hosted helm-репозиторий Nexus принимает .tgz обычным HTTP PUT/POST.
          # Учётные данные берутся из Secrets, в YAML их нет.
          run: |
            CHART_TGZ="$(ls ./packaged/${HELM_CHART}-*.tgz)"
            curl --fail --silent --show-error \
              -u "${NEXUS_HELM_REPO_USER}:${NEXUS_HELM_REPO_PASSWORD}" \
              --upload-file "${CHART_TGZ}" \
              "${NEXUS_HELM_REPO%/}/"

  # Деплоим приложения в кластер Kubernetes с помощью helm-чарт
  deploy_helm_chart_to_kubernetes:
      name: Deploy Helm Chart To Kubernetes
      runs-on: ubuntu-latest
      needs: add_helm_chart_to_nexus

      steps:
        - name: Set up Helm
          uses: azure/setup-helm@v3
          with:
            version: v3.14.0
        - name: Configure kubeconfig
          run: |
            mkdir -p ~/.kube
            if printf '%s' "${KUBE_CONFIG}" | grep -q 'apiVersion'; then
              printf '%s' "${KUBE_CONFIG}" > ~/.kube/config
            else
              printf '%s' "${KUBE_CONFIG}" | base64 -d > ~/.kube/config
            fi
            chmod 600 ~/.kube/config
            kubectl config current-context
        - name: Add Nexus Helm repository
          run: |
            helm repo add nexus "${NEXUS_HELM_REPO}" \
              --username "${NEXUS_HELM_REPO_USER}" \
              --password "${NEXUS_HELM_REPO_PASSWORD}"
            helm repo update
        - name: Read database secrets from Vault
          env:
            VAULT_ADDR: "${{ vars.VAULT_SCHEME || 'http' }}://${{ vars.VAULT_HOST }}:${{ vars.VAULT_PORT || '8200' }}"
            VAULT_KV_PATH: "${{ vars.VAULT_KV_PATH || 'kv/sausage-store' }}"
          run: |
            set -euo pipefail
            mount="${VAULT_KV_PATH%%/*}"
            path="${VAULT_KV_PATH#*/}"
            # KV v2 -> /v1/<mount>/data/<path>, данные в .data.data; KV v1 -> /v1/<mount>/<path>, данные в .data
            if resp="$(curl -sSf -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/${mount}/data/${path}")"; then
              data="$(printf '%s' "${resp}" | jq -c '.data.data')"
            else
              resp="$(curl -sSf -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/${mount}/${path}")"
              data="$(printf '%s' "${resp}" | jq -c '.data')"
            fi
            get() { printf '%s' "${data}" | jq -er --arg k "$1" '.[$k] // empty'; }

            POSTGRES_PASSWORD="$(get spring.datasource.password)"
            MONGODB_URI="$(get spring.data.mongodb.uri)"
            MONGO_ROOT_PASSWORD="$(get mongodb.root.password)"
            # Пользователь/пароль прикладного пользователя Mongo берутся из того же URI,
            # который использует бэкенд: mongodb://<user>:<password>@host:port/db
            MONGO_APP_USERNAME="$(printf '%s' "${MONGODB_URI}" | sed -E 's#^mongodb(\+srv)?://([^:/@]+):([^@]+)@.*#\2#')"
            MONGO_APP_PASSWORD="$(printf '%s' "${MONGODB_URI}" | sed -E 's#^mongodb(\+srv)?://([^:/@]+):([^@]+)@.*#\3#')"

            for v in POSTGRES_PASSWORD MONGODB_URI MONGO_ROOT_PASSWORD MONGO_APP_USERNAME MONGO_APP_PASSWORD; do
              [ -n "${!v}" ] || { echo "::error::${v} could not be resolved from Vault (${VAULT_KV_PATH})"; exit 1; }
              echo "::add-mask::${!v}"
            done
            # Секретные значения передаём helm отдельным values-файлом (JSON), а не через --set:
            # так любые спецсимволы в паролях (запятые, кавычки) не ломают разбор.
            jq -n \
              --arg pg "${POSTGRES_PASSWORD}" \
              --arg mroot "${MONGO_ROOT_PASSWORD}" \
              --arg muser "${MONGO_APP_USERNAME}" \
              --arg mpass "${MONGO_APP_PASSWORD}" \
              --arg muri "${MONGODB_URI}" \
              '{
                 infra: {
                   postgresql: { env: { POSTGRES_PASSWORD: $pg } },
                   mongodb: { env: { MONGO_INITDB_ROOT_PASSWORD: $mroot }, app: { username: $muser, password: $mpass } }
                 },
                 "backend-report": { secret: { db: $muri } }
               }' > "${RUNNER_TEMP}/db-secrets.json"
            chmod 600 "${RUNNER_TEMP}/db-secrets.json"
            echo "Secrets resolved from Vault (${VAULT_KV_PATH})"
        - name: Recover release state
          run: |
            if helm status "${HELM_RELEASE}" --namespace "${SAUSAGE_STORE_NAMESPACE}" >/dev/null 2>&1; then
              history="$(helm history "${HELM_RELEASE}" --namespace "${SAUSAGE_STORE_NAMESPACE}" -o json)"
              last_status="$(printf '%s' "${history}" | jq -r 'last.status')"
              deployed_rev="$(printf '%s' "${history}" | jq -r 'map(select(.status == "deployed")) | last.revision // empty')"
              if [[ "${last_status}" == pending-* && -n "${deployed_rev}" ]]; then
                echo "Release is stuck in ${last_status} - rolling back to revision ${deployed_rev}"
                helm rollback "${HELM_RELEASE}" "${deployed_rev}" --namespace "${SAUSAGE_STORE_NAMESPACE}" --wait --timeout 5m
              elif [[ -z "${deployed_rev}" ]]; then
                echo "Release ${HELM_RELEASE} has no deployed revisions - uninstalling it before a fresh install"
                helm uninstall "${HELM_RELEASE}" --namespace "${SAUSAGE_STORE_NAMESPACE}" --wait
              fi
            fi
        - name: Deploy Helm chart from Nexus
          run: |
            helm upgrade --install "${HELM_RELEASE}" "nexus/${HELM_CHART}" \
              --version "${HELM_CHART_VERSION}" \
              --namespace "${SAUSAGE_STORE_NAMESPACE}" \
              --set backend.image="${{ secrets.DOCKER_USER }}/sausage-backend:${{ github.sha }}" \
              --set frontend.image="${{ secrets.DOCKER_USER }}/sausage-frontend:${{ github.sha }}" \
              --set backend-report.image="${{ secrets.DOCKER_USER }}/sausage-backend-report:${{ github.sha }}" \
              --set backend.vault.host="${{ vars.VAULT_HOST }}" \
              --set backend.vault.port="${{ vars.VAULT_PORT || '8200' }}" \
              --set backend.vault.scheme="${{ vars.VAULT_SCHEME || 'http' }}" \
              --set backend.vault.token="${VAULT_TOKEN}" \
              -f "${RUNNER_TEMP}/db-secrets.json" \
              --history-max 3 \
              --wait --timeout 10m
            rm -f "${RUNNER_TEMP}/db-secrets.json"
        - name: Show release status
          continue-on-error: true
          run: |
            for attempt in 1 2 3; do
              if helm list --namespace "${SAUSAGE_STORE_NAMESPACE}" \
                 && helm status "${HELM_RELEASE}" --namespace "${SAUSAGE_STORE_NAMESPACE}" \
                 && kubectl -n "${SAUSAGE_STORE_NAMESPACE}" get pods,pvc,svc,ingress,hpa,vpa; then
                exit 0
              fi
              echo "attempt ${attempt} failed, retrying in 15s"; sleep 15
            done
            exit 1
